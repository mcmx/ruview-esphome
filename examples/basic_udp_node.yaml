# RuView CSI — Basic UDP Node
#
# Minimal configuration: streams raw CSI + vitals packets over UDP to an
# aggregator.  Only the diagnostic text sensor is exposed to Home Assistant.
#
# Hardware: ESP32-S3 (8 MB flash recommended)
# Framework: ESP-IDF (required for CSI API)

external_components:
  - source:
      type: local
      path: ../components

esphome:
  name: ruview-basic-node
  friendly_name: RuView Basic Node
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_WIFI_CSI_ENABLED: "y"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ---- RuView CSI core ----
ruview_csi:
  id: ruview_node
  node_id: 1
  target_ip: 192.168.1.50
  target_port: 5005
  wifi_channel: 0              # 0 = use whatever channel Wi-Fi connects on
  udp_raw_enabled: true
  udp_vitals_enabled: true
  edge_enabled: true
  edge_tier: 1
  vital_interval_ms: 1000
  top_k_count: 3
  presence_threshold: 0.0      # 0 = auto-calibrate (~60 s)
  fall_threshold: 15.0
  load_runtime_from_nvs: true
  persist_runtime_to_nvs: false
  nvs_namespace: csi_cfg

# ---- Diagnostic text sensor only ----
text_sensor:
  - platform: ruview_csi
    state:
      name: RuView State
