# RuView CSI — Edge Vitals Node
#
# Full edge mode: presence + vitals + fall detection exposed to Home
# Assistant, with UDP streaming to the RuView aggregator.
#
# Hardware: ESP32-S3 (8 MB flash recommended)
# Framework: ESP-IDF (required for CSI API)

external_components:
  - source:
      type: local
      path: ../components

esphome:
  name: ruview-cabin-node
  friendly_name: RuView Cabin Node
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_WIFI_CSI_ENABLED: "y"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

# ---- RuView CSI core ----
ruview_csi:
  id: ruview_node
  node_id: 3
  target_ip: 192.168.1.20
  target_port: 5005
  wifi_channel: 6
  udp_raw_enabled: true
  udp_vitals_enabled: true
  edge_enabled: true
  edge_tier: 1
  vital_interval_ms: 1000
  top_k_count: 3
  presence_threshold: 0.35
  fall_threshold: 0.80
  load_runtime_from_nvs: true
  persist_runtime_to_nvs: false
  nvs_namespace: csi_cfg

# ---- Binary sensors ----
binary_sensor:
  - platform: ruview_csi
    presence:
      name: Cabin Presence
    fall_detected:
      name: Cabin Fall Detected

# ---- Analog sensors ----
sensor:
  - platform: ruview_csi
    motion_energy:
      name: Cabin Motion Energy
    breathing_bpm:
      name: Cabin Breathing BPM
    heart_rate_bpm:
      name: Cabin Heart Rate BPM
    rssi:
      name: Cabin RSSI
    csi_frames_received:
      name: CSI Frames Received
    adr018_frames_sent:
      name: ADR018 Frames Sent
    vitals_packets_sent:
      name: Vitals Packets Sent

# ---- State text sensor ----
text_sensor:
  - platform: ruview_csi
    state:
      name: RuView State

# ---- Runtime threshold tuning ----
number:
  - platform: ruview_csi
    presence_threshold:
      name: Presence Threshold
    fall_threshold:
      name: Fall Threshold
